# version: '3.8'

services:
  db:
    image: postgres:15-alpine
    env_file:
      - ./.env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-guessing_game_db}
      - POSTGRES_USER=${POSTGRES_USER:-usuario}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-senha123}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend/DACOMP_Guessr
    volumes:
      - ./backend/DACOMP_Guessr:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - ./.env
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY}
      - PUBLIC_TUNNEL_URL=${PUBLIC_TUNNEL_URL:-}
      - EXTRA_ALLOWED_HOSTS=${EXTRA_ALLOWED_HOSTS:-}
      - POSTGRES_DB=${POSTGRES_DB:-guessing_game_db}
      - POSTGRES_USER=${POSTGRES_USER:-usuario}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-senha123}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - DJANGO_SUPERUSER_USERNAME=admin
      - DJANGO_SUPERUSER_EMAIL=admin@admin.com
      - DJANGO_SUPERUSER_PASSWORD=admin123

volumes:
  postgres_data_dev:
